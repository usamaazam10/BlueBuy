name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only run one deployment at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Firebase/Cloudinary values are NEXT_PUBLIC_* (safe to expose) but must
        # be present AT BUILD TIME to be inlined into the static export. Without
        # them the exported site has no backend config and every product page /
        # storefront read fails. Provide them as GitHub Actions repository
        # secrets (Settings → Secrets and variables → Actions).
        #
        # The site is served from the custom domain https://bluebuy.store/, at
        # the ORIGIN ROOT — so the base path must be EMPTY. These were
        # previously taken from `actions/configure-pages`, which reported the
        # project-site values (`/BlueBuy` + github.io); every asset then
        # resolved to /BlueBuy/_next/... which 404s on the apex domain, and the
        # site rendered as unstyled HTML. They are pinned here instead of
        # auto-detected so a Pages-settings change can't silently break assets.
        #
        # Override via repository *variables* (Settings → Secrets and variables
        # → Actions → Variables) if the site ever moves back to a project-site
        # URL: set SITE_BASE_PATH=/BlueBuy and SITE_URL=https://usamaazam10.github.io
        #
        # NEXT_PUBLIC_SITE_URL is the origin ONLY (no subpath) — the subpath is
        # added separately as NEXT_PUBLIC_BASE_PATH, and `absoluteUrl`
        # (src/lib/seo.ts) composes the two. Putting the base path in both would
        # double it in every canonical/OG/sitemap URL.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://bluebuy.store' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          NEXT_PUBLIC_STORE_WHATSAPP: ${{ secrets.NEXT_PUBLIC_STORE_WHATSAPP }}
          # OPTIONAL. The build reads the store currency straight from
          # `site_settings` in Firestore and bakes it into prerendered prices, so
          # this normally needs no value. Set it only as a safety net for builds
          # that cannot reach Firestore, in which case it must match CMS → Site
          # settings → Regional → Currency. Unset falls back to USD.
          NEXT_PUBLIC_DEFAULT_CURRENCY: ${{ vars.DEFAULT_CURRENCY }}
          # Optional — App Check (reCAPTCHA v3). Leave the secret unset to ship
          # with App Check disabled (the code no-ops on an empty value). Set it
          # once you register the site in Firebase console → App Check and are
          # ready to attach attestation tokens. See AUTHENTICATION.md.
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
